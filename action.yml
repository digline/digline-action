# The digline gate, as a GitHub Action.
#
# Composite rather than a docker action, and the reason is the image's own
# promise. `ghcr.io/digline/digline` contains the CLI and the three provider
# plugins and *nothing else* — no dynamic installs, ever — but `digline compare`
# **loads the suite**, and a `suite.py` imports the application under test. So a
# docker action, whose `runs.image` is a static string that cannot be an input,
# would hard-code that ceiling: it would gate a `suite.toml` and a suite that
# imports nothing but digline, and refuse everybody else.
#
# A composite step takes `image` as an input, so a repository whose suite has
# dependencies of its own derives the image — `FROM ghcr.io/digline/digline` plus
# its own installs — and points this at it. It also has more than one step, which
# is what lets the pull request comment live here instead of in every caller's
# workflow, and it puts `--user` and the ownership check in a shell block a
# reader can see rather than inside a container contract.
name: digline
description: >-
  LLM regression gate for pull requests: compare this branch against a
  baseline committed in your repository.
author: Alessandro Prandini

branding:
  icon: activity
  color: purple

inputs:
  # The four that mirror the CLI, by its own names. `--suite`, `--root`,
  # `--tenant` and `--env` mean here exactly what they mean there — the last two
  # verify what the suite declares and never override it, which is how a run
  # avoids being filed under the wrong customer.
  suite:
    description: "path/to/suite.py[:attribute] or path/to/suite.toml, from the repository root"
    required: true
  root:
    description: "directory holding .digline/ (the CLI's --root)"
    required: false
    default: "."
  tenant:
    description: "verify the suite's tenant; never overrides"
    required: false
    default: ""
  env:
    description: "verify the suite's environment; never overrides"
    required: false
    default: ""

  image:
    description: >-
      The image to run. The default names a digline release — this action is on
      its own version line (v1.x) and digline is not, so @v1 does not tell you
      which digline you get, and this input is where that is written down. CI
      checks it against the newest digline on PyPI, so it cannot quietly fall
      behind. Point it at your own derivation — FROM
      ghcr.io/digline/digline:<version> plus your suite's dependencies — when
      your suite.py imports an application.
    required: false
    default: "ghcr.io/digline/digline:0.30.0"

  run:
    description: >-
      Produce a run before comparing. THIS CALLS YOUR PROVIDER AND SPENDS MONEY.
      Set to false when an earlier step already ran the suite, and this compares
      the latest stored run instead.
    required: false
    default: "true"

  comment:
    description: "post the comparison on the pull request (needs pull-requests: write)"
    required: false
    default: "true"
  comment-on-success:
    description: >-
      Comment when nothing got worse, too. Off by default: a comment on every
      green pull request is what teaches a reviewer to scroll past digline's
      comments, and the green check already carries that news. A regression and
      an unjudged run always comment, whatever this says.
    required: false
    default: "false"

  forward-env:
    description: >-
      Environment variables to pass into the container, by name, when they are
      set on this step. The default covers the three first-party plugins; add
      yours here rather than baking a key into an image.
    required: false
    default: >-
      ANTHROPIC_API_KEY
      OPENAI_API_KEY
      OPENAI_BASE_URL
      AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY
      AWS_SESSION_TOKEN
      AWS_REGION
      AWS_DEFAULT_REGION
  github-token:
    description: "token used to post the comment"
    required: false
    default: ${{ github.token }}

# These survive the action failing, which is the case that matters: the gate
# step records the outcome and exits 0, and the `verdict` step at the end is
# what carries it. All four are written on every path, a failed `digline run`
# included, and the action's own CI asserts it on each one.
outputs:
  exit-code:
    description: >-
      digline's exit code, unchanged. 0 nothing got worse, 1 something got
      worse: those two are the verdict. 2 the run could not be judged, 64
      digline refused the request, 70 digline failed in a way nobody
      anticipated: those three are digline's and are not a verdict. Empty when
      digline gave no code because the action itself failed, as when the image
      could not be pulled: that is not a digline code and is not reported as
      one.
    value: ${{ steps.gate.outputs.exit-code }}
  headline:
    description: >-
      The first line of the comparison when digline compared: the same
      sentence the report shows. Otherwise a sentence from this action that
      names the code and where the reason is, never digline's stderr.
    value: ${{ steps.gate.outputs.headline }}
  run-key:
    description: >-
      The key of the run that was compared; `latest` with `run: false`. Empty
      when `digline run` failed and there is no run.
    value: ${{ steps.gate.outputs.run-key }}
  report:
    description: >-
      Path to the file holding the compare output, verbatim. The file always
      exists, and is empty when nothing was compared.
    value: ${{ steps.gate.outputs.report }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        INPUT_SUITE: ${{ inputs.suite }}
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_TENANT: ${{ inputs.tenant }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_RUN: ${{ inputs.run }}
        INPUT_FORWARD_ENV: ${{ inputs.forward-env }}
      run: |
        # `set +e` FIRST, and it is load-bearing.
        #
        # GitHub runs `shell: bash` as `bash -e {0}`, so errexit is already on
        # when this script starts — `set -uo pipefail` below does not clear it.
        # The entire job of this step is to CAPTURE a non-zero exit from
        # `compare` rather than die of it, and with errexit on it died at the
        # pipeline: no outputs, no environment, no annotation, and **no
        # comment** — the feature this action exists for, absent on exactly the
        # runs it exists for. Found by the red fixture, which is what a red
        # fixture is for.
        set +e
        set -uo pipefail

        digline() {
          docker run "${docker_args[@]}" "${INPUT_IMAGE}" "$@"
        }

        report="${RUNNER_TEMP:-/tmp}/digline-compare.txt"
        : > "${report}"
        key=""

        # A code is one of three kinds, and the kind decides every word said about
        # it. `verdict`: 0 and 1, digline's answer about the suite. `digline`: 2, 64
        # and 70, digline's own codes that are not a verdict. `action`: anything else,
        # which digline never exits with, so it is this action failing (an image that
        # could not be pulled is docker's 125) and it is never reported as digline's.
        # The table is digline's `wire/contract.py`, and 70 is ADR 0041's.
        kind_of() {
          case "$1" in
            0|1) echo verdict ;;
            2|64|70) echo digline ;;
            *) echo action ;;
          esac
        }
        name_of() {
          case "$1" in
            0) echo "nothing got worse" ;;
            1) echo "something got worse" ;;
            2) echo "the run could not be judged" ;;
            64) echo "digline refused the request" ;;
            70) echo "digline failed in a way nobody anticipated" ;;
          esac
        }

        # The one place the outputs are written, and every path ends here: a gate that
        # stops before recording leaves `exit-code` empty, and an empty code is how
        # this action used to turn a refused run into a 1.
        #
        #   record <what ran> <code> [action]
        #
        # `action` forces the third kind whatever the number, for a stop of this step's
        # own: its code is the shell's, and a 1 from bash is not digline's 1.
        #
        # The headline is the comparison's first line when there is one. Otherwise it
        # is a sentence written here, and never digline's stderr: what a suite or the
        # code it imports prints there can quote the payload, and it reaches the
        # person reading the log and no one else. (ADR 0043)
        recorded=""
        record() {
          local what=$1 code=$2 kind headline failed=""
          kind=${3:-$(kind_of "${code}")}
          headline=$(head -n 1 "${report}")
          case "${kind}" in
            verdict|digline)
              if [ -z "${headline}" ]; then
                headline="${what} exited ${code}: $(name_of "${code}")."
                headline="${headline} It is not a verdict on the suite; the reason is in the job log."
              fi
              ;;
            action)
              failed=${code}
              headline="${what} ended with ${code}, which is not reported as a digline exit"
              headline="${headline} code: this action failed before digline gave an answer."
              headline="${headline} 125 to 127 are docker's own, an image that could not be"
              headline="${headline} pulled or started. The reason is in the job log."
              code=""
              ;;
          esac

          # The .digline/ a run writes belongs to whoever owns the checkout. A warning
          # and not a failure: it says the --user above did not take, which will break
          # a later step of the caller's workflow, but it says nothing about the
          # comparison, and the comparison is what this action is for.
          stored="${GITHUB_WORKSPACE:-.}/${INPUT_ROOT:-.}/.digline"
          if [ -d "${stored}" ] &&
             find "${stored}" ! -user "$(id -u)" -print -quit | grep -q .; then
            note="${stored} holds files owned by another user, so later steps"
            note="${note} that touch it may fail. This means --user did not take."
            echo "::warning title=digline wrote files you do not own::${note}"
          fi

          {
            echo "exit-code=${code}"
            echo "run-key=${key}"
            echo "report=${report}"
            echo "kind=${kind}"
            echo "failed=${failed}"
            echo "headline<<DIGLINE_HEADLINE"
            echo "${headline}"
            echo "DIGLINE_HEADLINE"
          } >> "${GITHUB_OUTPUT}"
          recorded=1

          case "${kind}:${code}" in
            verdict:0) echo "::notice title=digline: nothing got worse::${headline}" ;;
            verdict:1) echo "::error title=digline: something got worse::${headline}" ;;
            digline:2) echo "::error title=digline: the run could not be judged::${headline}" ;;
            digline:64) echo "::error title=digline refused the request (exit 64)::${headline}" ;;
            digline:70) echo "::error title=digline: internal error (exit 70)::${headline}" ;;
            action:*) echo "::error title=digline-action failed; not a digline exit code::${headline}" ;;
          esac
        }
        # A stop nobody planned for, `set -u` meeting an unset name included, still
        # records: as this action failing, with the code the shell stopped on.
        trap 'rc=$?; [ -n "${recorded}" ] || record "the gate step" "${rc}" action' EXIT

        # --user, and it is the whole reason this is a shell step you can read.
        #
        # The image runs as its own uid 1000; the checkout belongs to the runner,
        # which is 1001 on GitHub-hosted machines. Without this every file the
        # run writes into .digline/ arrives owned by somebody the later steps of
        # the workflow are not — an artifact upload, a `git status`, a cache
        # save, all failing for a reason that names nothing.
        #
        # HOME because a uid with no passwd entry inside the container has no
        # home directory, and something reaching for one would find nothing.
        # Nothing digline does needs it; being explicit costs one flag.
        docker_args=(
          --rm
          --user "$(id -u):$(id -g)"
          --env HOME=/tmp
          --volume "${GITHUB_WORKSPACE}:/work"
          --workdir /work
        )
        # Only names that are actually set, and only names — `--env NAME` passes
        # the value through from this step's environment, so no secret is ever
        # written into a command line where `set -x` or a log could show it.
        for name in ${INPUT_FORWARD_ENV}; do
          if [ -n "${!name-}" ]; then
            docker_args+=(--env "${name}")
            echo "forwarding ${name}"
          fi
        done

        perimeter=(--root "${INPUT_ROOT}")
        if [ -n "${INPUT_TENANT}" ]; then perimeter+=(--tenant "${INPUT_TENANT}"); fi
        if [ -n "${INPUT_ENV}" ]; then perimeter+=(--env "${INPUT_ENV}"); fi


        if [ "${INPUT_RUN}" = "true" ]; then
          # The planned call count goes to stderr and lands in the log before
          # the first call, which is where somebody paying for it can see it.
          # stdout is the key alone, which is why it can be captured like this.
          key=$(digline run --suite "${INPUT_SUITE}" "${perimeter[@]}")
          ran=$?
          if [ "${ran}" -ne 0 ]; then
            # digline's code, whatever it is: 64 for a suite that could not be
            # loaded, 70 for a failure nobody anticipated. Never 1, which is
            # "something got worse" about a run that does not exist. (ADR 0041)
            key=""
            record "digline run" "${ran}"
            exit 0
          fi
          echo "ran ${INPUT_SUITE}: ${key}"
        else
          key=latest
        fi

        # stdout alone. `latest` can put a note on stderr, and merging the two
        # would put it in the report at a position nothing guarantees — while
        # the first line of the report is what becomes the `headline` output.
        # The note still reaches the job log, which is where it is actionable.
        digline compare --suite "${INPUT_SUITE}" --run "${key}" \
          "${perimeter[@]}" | tee "${report}"
        compared=${PIPESTATUS[0]}
        record "digline compare" "${compared}"

        # This step *reports* the outcome; the `verdict` step at the end of the
        # action is what carries it. Exiting 0 here deliberately, rather than
        # on whatever the last construct happened to return.
        exit 0

    # Always, so that the comment happens on the outcomes it exists for: every
    # one but 0 is marked as an error by the step above, and a comment posted
    # only on success would be a comment posted only when nobody needs it. An
    # action failure leaves `exit-code` empty, which is not '0', so it comments.
    - id: comment
      if: >-
        always()
        && inputs.comment == 'true'
        && github.event.pull_request.number
        && (steps.gate.outputs.exit-code != '0' || inputs.comment-on-success == 'true')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        SUITE: ${{ inputs.suite }}
        REPORT: ${{ steps.gate.outputs.report }}
        STATUS: ${{ steps.gate.outputs.exit-code }}
        KIND: ${{ steps.gate.outputs.kind }}
        FAILED: ${{ steps.gate.outputs.failed }}
        HEADLINE: ${{ steps.gate.outputs.headline }}
      run: |
        set -euo pipefail

        # The three kinds the gate step recorded, in the same words.
        case "${KIND}:${STATUS}" in
          verdict:0) verdict="Nothing got worse." ;;
          verdict:1) verdict="**Something got worse.**" ;;
          digline:2) verdict="**The run could not be judged**, so nothing downstream of it is meaningful." ;;
          digline:64) verdict="**digline refused the request** (exit \`64\`). This is not a verdict on the suite." ;;
          digline:70) verdict="**digline failed in a way nobody anticipated** (exit \`70\`). This is not a verdict on the suite." ;;
          *) verdict="**This action failed before digline gave an answer** (\`${FAILED:-nothing recorded}\`, which is not reported as a digline exit code). This is not a verdict on the suite." ;;
        esac

        # The comparison goes in verbatim, in a fence. It already carries the
        # headline, the files that moved, the configuration that differed and a
        # line per regression — composed by `digline.report`, in the wording the
        # HTML report uses. Re-rendering it into a table here would be a second
        # rendering of one truth, drifting from the first the day either moves.
        # The suite name is reduced to a safe alphabet before it goes anywhere
        # near a jq program or an HTML comment. Two things it stops, both found
        # by an adversarial pass: a `"` in the path breaks out of the jq string
        # literal below — at best losing the comment, at worst selecting a
        # different comment id and editing somebody else's comment — and a
        # `-->` in it closes this HTML comment early, so the marker becomes
        # visible text and stops matching. The value is workflow-author
        # controlled rather than attacker controlled, which is why this is a
        # robustness fix and not an advisory; it is one line either way.
        key=$(printf '%s' "${SUITE}" | tr -c 'A-Za-z0-9._/-' '-')
        marker="<!-- digline-action:${key} -->"
        body="${RUNNER_TEMP:-/tmp}/digline-comment.md"

        # The fence is as long as it needs to be, and it is not decoration.
        #
        # `compare` prints the **configuration that differed**, by value —
        # `resolved_model gpt-4o-mini → acme-legal-v3`, and the fingerprint
        # beside it. Those are strings whatever server answered wrote, and for
        # an OpenAI-compatible endpoint that server is software the customer
        # runs and nobody here reviews: the same untrusted class the 0.8.1
        # withholding was about. The assertion and case names come from the
        # suite, which goes through review; these do not.
        #
        # Three backticks in such a value would close a three-backtick fence
        # and let the rest render as Markdown in a comment a reviewer trusts.
        # So: longer than the longest run of backticks in the report, which is
        # what CommonMark's fence rule is for.
        #
        # (`compare` does *not* print the judge's own `reason` — its lines are
        # case, assertion and what happened. An earlier version of this comment
        # said it did. The rule is unchanged; only the example was wrong.)
        {
          echo "${marker}"
          echo "### digline — \`${SUITE}\`"
          echo
          echo "${verdict}"
          echo
          if [ -n "${REPORT}" ] && [ -s "${REPORT}" ]; then
            # `|| true` inside, because a report with no backtick at all is the
            # ordinary one: grep then exits 1, `pipefail` hands that to the
            # assignment, `set -e` ends the step, and no comment is posted.
            # That is how every comment was lost from v1.0.0 to this line.
            longest=$({ grep -o '`\+' "${REPORT}" || true; } | awk '{ print length }' | sort -rn | head -n 1)
            fence=$(printf '`%.0s' $(seq $(( ${longest:-0} < 3 ? 3 : longest + 1 ))))
            echo "${fence}"
            cat "${REPORT}"
            echo "${fence}"
          else
            # Nothing was compared, so there is no comparison to quote. The
            # reason is digline's stderr, and it stays in the job log: what a
            # suite or the code it imports prints there can quote the payload,
            # and this comment reaches everybody who can read the pull request.
            # (ADR 0043)
            echo "${HEADLINE}"
          fi
          echo
          if [ -n "${STATUS}" ]; then
            echo "<sub>Exit code \`${STATUS}\`: \`0\` fine, \`1\` something got"
            echo "worse, \`2\` could not be judged, \`64\` refused, \`70\` failed"
            echo "unexpectedly. The baseline is the one committed in this"
          else
            echo "<sub>No digline exit code. The baseline is the one committed in this"
          fi
          echo "repository; promoting a new one is a person's command, never this"
          echo "action's.</sub>"
        } > "${body}"

        # Edited in place rather than appended to, so a branch pushed eleven
        # times carries one comment saying what is true now instead of eleven
        # saying what was true once. Keyed on the marker, which carries the
        # suite: two suites in one workflow keep two comments.
        # `--jq` runs once per page under `--paginate`, so a filter ending in
        # `last` would print one id per page rather than one overall. The
        # selection streams and `tail` picks the newest across every page.
        # A comment that cannot be posted must not become the job's verdict.
        # The commonest cause is a workflow without `pull-requests: write`, and
        # turning that into a failed gate would report "something got worse"
        # about a run that may well have been green. It warns, and the exit
        # code below is still digline's.
        set +e
        post() {
          existing=$(gh api "repos/${GH_REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" \
            | tail -n 1) || return 1
          if [ -n "${existing}" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${existing}" \
              -F body=@"${body}" --silent || return 1
            echo "updated comment ${existing}"
          else
            gh pr comment "${PR}" --body-file "${body}" || return 1
          fi
        }
        if ! post; then
          note="the comparison could not be posted. The commonest cause is a"
          note="${note} workflow without \`permissions: pull-requests: write\`."
          note="${note} The verdict is unaffected and is in the log above."
          echo "::warning title=digline: the comment was not posted::${note}"
        fi
        exit 0

    # The gate itself, last, so the comment is posted before the job fails.
    # The exit code is digline's, unchanged, 2, 64 and 70 included: it is the
    # contract, and an action that translated it into a pass/fail of its own
    # would be throwing away the difference between "this got worse" and "this
    # could not be judged". It never puts a 1 where digline gave another code.
    - id: verdict
      if: always()
      shell: bash
      env:
        STATUS: ${{ steps.gate.outputs.exit-code }}
        FAILED: ${{ steps.gate.outputs.failed }}
      run: |
        if [ -n "${STATUS}" ]; then exit "${STATUS}"; fi
        # No digline code: this action failed. It exits with what failed, so
        # docker's 125 reads as docker's. Never 0, which would be a green gate
        # for a job that judged nothing, and never a number in digline's table,
        # which would read as digline's answer: 255 stands in for both, and for
        # a gate step that recorded nothing at all.
        case "${FAILED}" in
          ''|0|1|2|64|70) exit 255 ;;
          *) exit "${FAILED}" ;;
        esac
