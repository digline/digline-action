# The action, tested the only way an action can be: by running it.
#
# Not a lint of `action.yml` and not a unit test of the shell inside it — a real
# `uses:` against a real fixture, through the real image, asserting the real
# exit code. The green job proves it passes what should pass; the red job proves
# it *fails*, which is the half that a gate quietly losing its teeth would leave
# green.
#
# Nothing here needs a key or a network to a provider. The fixtures are stored
# runs and the jobs gate with `run: false`, so no target is ever called. The
# path that spends money — `run: true` — is deliberately not exercised here:
# doing so would mean either a paid provider call on every push, or a container
# network flag this action does not expose. That is stated rather than hidden.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: the image tag this action defaults to is republished on digline's
    # releases, and a scheduled run is what notices it moving under us.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

#: The image the tests pin. Explicit rather than inherited from the action's
#: default, so a job asserts the two agree instead of both drifting together.
env:
  TEST_IMAGE: ghcr.io/digline/digline:0.30.0

jobs:
  green:
    name: A clean comparison passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: gate
        uses: ./
        with:
          suite: test/fixtures/green/suite.toml
          root: test/fixtures/green
          image: ${{ env.TEST_IMAGE }}
          run: "false"
          comment: "false"

      - name: The exit code is 0, and the outputs say why
        run: |
          set -euo pipefail
          echo "exit-code: ${{ steps.gate.outputs.exit-code }}"
          echo "headline:  ${{ steps.gate.outputs.headline }}"
          [ "${{ steps.gate.outputs.exit-code }}" = "0" ] || {
            echo "expected exit 0 from a clean comparison"; exit 1; }
          # Not merely zero: zero for the right reason. A fixture that stopped
          # comparing anything would also exit 0.
          case "${{ steps.gate.outputs.headline }}" in
            "Nothing got worse"*) ;;
            *) echo "the headline is not the clean one"; exit 1 ;;
          esac
          [ -s "${{ steps.gate.outputs.report }}" ] || {
            echo "the report file is empty"; exit 1; }

  red:
    name: A regression fails the job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `continue-on-error` so the job can *assert* the failure instead of
      # dying of it. The step's `outcome` is what it really did; its
      # `conclusion` is what continue-on-error turned that into, and asserting
      # the first is the whole point of this job.
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          suite: test/fixtures/worse/suite.toml
          root: test/fixtures/worse
          image: ${{ env.TEST_IMAGE }}
          run: "false"
          comment: "false"

      # The outputs are asserted on a **failing** action, which is the case
      # worth pinning: the gate step records the verdict and exits 0, and the
      # `verdict` step at the end is what fails the job. Get that order wrong —
      # as an earlier version did, by dying inside the gate step on an inherited
      # `errexit` — and everything after it is lost: outputs, annotation, and
      # the pull request comment this action exists to post.
      - name: The step failed, with exit 1 and a headline that names the cause
        if: always()
        run: |
          set -euo pipefail
          echo "outcome:   ${{ steps.gate.outcome }}"
          echo "exit-code: '${{ steps.gate.outputs.exit-code }}'"
          echo "headline:  ${{ steps.gate.outputs.headline }}"

          [ "${{ steps.gate.outcome }}" = "failure" ] || {
            echo "the action did not fail the step on a regression: a gate that"
            echo "cannot fail is not a gate"; exit 1; }

          [ "${{ steps.gate.outputs.exit-code }}" = "1" ] || {
            echo "expected digline's exit 1, got '${{ steps.gate.outputs.exit-code }}'"
            echo "An empty string here means the action died before recording"
            echo "anything — which is what an inherited errexit did once, taking"
            echo "the comment with it. 1 is 'something got worse'; 2 would be"
            echo "'could not be judged', and this fixture is neither."; exit 1; }

          case "${{ steps.gate.outputs.headline }}" in
            "1 check got worse"*) ;;
            *) echo "the headline does not name the regression"; exit 1 ;;
          esac

  refused:
    name: A refused run exits 64, never 1
    # The path that lost digline's code until v1.1.0: `digline run` failing.
    # The action exited 1, "something got worse", about a run that does not
    # exist, with no outputs and no comment. A suite path that names nothing is
    # a refusal digline makes before it calls anything, so `run: true` here
    # spends nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: gate
        uses: ./
        continue-on-error: true
        with:
          suite: test/fixtures/absent/suite.toml
          image: ${{ env.TEST_IMAGE }}
          run: "true"
          comment: "false"

      - name: digline's 64, and all four outputs
        if: always()
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          CODE: ${{ steps.gate.outputs.exit-code }}
          HEADLINE: ${{ steps.gate.outputs.headline }}
          KEY: ${{ steps.gate.outputs.run-key }}
          REPORT: ${{ steps.gate.outputs.report }}
        run: |
          set -euo pipefail
          echo "outcome: ${OUTCOME}; exit-code: '${CODE}'; headline: ${HEADLINE}"
          [ "${OUTCOME}" = "failure" ] || { echo "a refused run passed the gate"; exit 1; }
          [ "${CODE}" = "64" ] || { echo "expected digline's 64, got '${CODE}'"; exit 1; }
          [ -z "${KEY}" ] || { echo "run-key '${KEY}' for a run that does not exist"; exit 1; }
          [ -f "${REPORT}" ] || { echo "the report output names no file"; exit 1; }
          case "${HEADLINE}" in
            "digline run exited 64: digline refused the request."*) ;;
            *) echo "the headline does not name the refusal"; exit 1 ;;
          esac

  unpulled:
    name: An image that cannot be pulled is the action failing, not digline
    # docker exits 125 when it cannot pull or start the image. That number is
    # docker's: it is reported as this action failing, `exit-code` stays empty,
    # and nothing calls it a refusal by digline, which is what it used to say.
    #
    # Asked twice, `run: "false"` and then `run: "true"`. With `run: true` the
    # image fails at `digline run` instead of `digline compare`, the path that
    # used to turn every failure into a 1. `run: true` is the default, and the
    # default path is measured on the runner, not inferred from the other one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: gate
        uses: ./
        continue-on-error: true
        with:
          suite: test/fixtures/green/suite.toml
          root: test/fixtures/green
          image: ghcr.io/digline/digline:0.0.0-absent
          run: "false"
          comment: "false"

      - name: No digline code, and a headline that says whose failure it is
        if: always()
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          CODE: ${{ steps.gate.outputs.exit-code }}
          HEADLINE: ${{ steps.gate.outputs.headline }}
        run: |
          set -euo pipefail
          echo "outcome: ${OUTCOME}; exit-code: '${CODE}'; headline: ${HEADLINE}"
          [ "${OUTCOME}" = "failure" ] || { echo "an unpulled image passed the gate"; exit 1; }
          [ -z "${CODE}" ] || { echo "exit-code '${CODE}' for a code digline never gave"; exit 1; }
          case "${HEADLINE}" in
            *"not reported as a digline exit code"*) ;;
            *) echo "the headline does not say the action failed"; exit 1 ;;
          esac

      - id: gate-run
        uses: ./
        continue-on-error: true
        with:
          suite: test/fixtures/green/suite.toml
          root: test/fixtures/green
          image: ghcr.io/digline/digline:0.0.0-absent
          run: "true"
          comment: "false"

      - name: The same with run true, the default, failing at digline run
        if: always()
        env:
          OUTCOME: ${{ steps.gate-run.outcome }}
          CODE: ${{ steps.gate-run.outputs.exit-code }}
          HEADLINE: ${{ steps.gate-run.outputs.headline }}
        run: |
          set -euo pipefail
          echo "outcome: ${OUTCOME}; exit-code: '${CODE}'; headline: ${HEADLINE}"
          [ "${OUTCOME}" = "failure" ] || { echo "an unpulled image passed the gate"; exit 1; }
          [ -z "${CODE}" ] || { echo "exit-code '${CODE}' for a code digline never gave"; exit 1; }
          case "${HEADLINE}" in
            *"not reported as a digline exit code"*) ;;
            *) echo "the headline does not say the action failed"; exit 1 ;;
          esac

  published:
    name: The README's own line works — digline/digline-action@v1
    # Every other job uses `./`, which tests the working tree. This one uses
    # the **published tag**, which is what the README tells a reader to write:
    # `uses: digline/digline-action@v1`. It is the only job that can catch a
    # `v1` that was never moved, or a release that left the floating tag
    # pointing at a commit where the action did not work.
    #
    # It runs against the fixture in *this* checkout, so it exercises the
    # tagged action over the current fixtures — the combination a user is in
    # the moment they upgrade digline but not the action.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: gate
        uses: digline/digline-action@v1
        with:
          suite: test/fixtures/green/suite.toml
          root: test/fixtures/green
          image: ${{ env.TEST_IMAGE }}
          run: "false"
          comment: "false"

      - run: |
          set -euo pipefail
          [ "${{ steps.gate.outputs.exit-code }}" = "0" ] || {
            echo "the published @v1 did not pass a clean comparison"; exit 1; }
          echo "digline/digline-action@v1 resolves and gates: ${{ steps.gate.outputs.headline }}"

  fence:
    name: The comment's fence, and every outcome's words and code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyyaml
      - run: test/fence.sh
      # Every outcome through the shipped steps with a stubbed docker: the
      # only way to reach a 70, which no real image produces on demand.
      - run: test/outcomes.sh

  image-tag:
    name: The default image tag is real, current, and agreed on
    # This action is on its own version line (v1.x) and digline is not, so `v1`
    # cannot *be* the image tag and the default has to say which digline it
    # means. Four things have to hold, and the fourth is the one that was
    # missing until 2026-09-23.
    #
    # The first three — default == TEST_IMAGE, every README tag == default, and
    # the tag resolves on ghcr — all compare the default against things derived
    # from the default. They are self-consistent by construction, so they went
    # green for ten minors while the default sat at 0.9.0 and digline shipped
    # 0.19.0. A check that cannot fail is not a check, and this surface went
    # unlooked-at *because* it was green.
    #
    # The weekly cron below was added to notice "the image tag moving under
    # us". A pinned tag does not move: `0.9.0` still resolves today. What moved
    # was the release the default should have been naming, which nothing asked
    # about. The fourth step is what the cron is actually for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet pyyaml

      - name: action.yml, the README and the test all name one tag
        run: |
          set -euo pipefail
          default=$(python3 -c "
          import yaml
          d = yaml.safe_load(open('action.yml'))
          print(d['inputs']['image']['default'])
          ")
          echo "action.yml default: ${default}"
          [ "${default}" = "${TEST_IMAGE}" ] || {
            echo "the tests pin ${TEST_IMAGE} but users get ${default}:"
            echo "CI would be proving something about an image nobody runs"
            exit 1; }

          # Every official-image reference in the README. A derived image
          # (ghcr.io/acme/...) is the escape hatch's example and is not one.
          quoted=$(grep -oE 'ghcr\.io/digline/digline:[0-9][^ "`]*' README.md \
                   | sort -u)
          echo "README quotes:"; echo "${quoted}" | sed 's/^/  /'
          for one in ${quoted}; do
            [ "${one}" = "${default}" ] || {
              echo "README quotes ${one}, action.yml defaults to ${default}"
              exit 1; }
          done

      - name: That image exists in the registry
        run: |
          set -euo pipefail
          repo=${TEST_IMAGE%:*}; tag=${TEST_IMAGE##*:}
          token=$(curl -sf "https://ghcr.io/token?scope=repository:${repo#ghcr.io/}:pull&service=ghcr.io" \
                  | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${repo#ghcr.io/}/manifests/${tag}")
          echo "manifest for ${TEST_IMAGE}: HTTP ${code}"
          [ "${code}" = "200" ] || {
            echo "the tag this action defaults to is not on the registry"; exit 1; }

      - name: And it names the digline that is current
        # The only step here that compares the default against something
        # *outside* this repository, which is why it is the only one that can
        # tell us we have drifted. PyPI's JSON API, because `info.version` is
        # the release digline itself considers current; the project page is
        # not usable for this — /project/<anything>/ answers 200.
        run: |
          set -euo pipefail
          tag=${TEST_IMAGE##*:}
          latest=$(curl -sfL https://pypi.org/pypi/digline/json \
                   | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "default names digline ${tag}; newest on PyPI is ${latest}"
          [ "${tag}" = "${latest}" ] || {
            echo
            echo "the default image does not name the current digline."
            echo "Bump all four together and they stay in step:"
            echo "  - action.yml   inputs.image.default"
            echo "  - ci.yml       env.TEST_IMAGE"
            echo "  - README.md    every ghcr.io/digline/digline:<version>"
            echo "  - README.md    the derived-image example"
            echo
            echo "If digline ${latest} has only just shipped, its image may not"
            echo "be on ghcr yet — the step above is what says so."
            exit 1; }

  gate:
    name: gate
    # The one check the `main` ruleset requires, by this name. The jobs above
    # are named to be read, and will be reworded; this one is named to be
    # required, and must not be. The ruleset once required five checks by
    # their job ids while GitHub published them by their names: every job
    # passed and the pull request stayed blocked, with nothing saying why.
    #
    # What it gates on is `needs:`, so the set of required jobs lives here and
    # changes through a pull request, not in the repository settings.
    #
    # The opposite failure is the quiet one. A job added above and left out of
    # `needs:` breaks nothing: no error, no red, and the gate simply does not
    # cover it. A new job belongs in `needs:` unless it is listed below with
    # its reason.
    #
    # Left out on purpose, so the absence reads as a choice:
    # - `published` tests the released `@v1`, not the code in the pull
    #   request, so it cannot pass or fail on the change being merged;
    # - `image-tag` asks PyPI for the newest digline, so it turns red when
    #   digline ships, whatever the pull request contains.
    # Neither belongs in a merge gate. Both still run and still show.
    #
    # `if: always()`, because a job whose `needs:` failed is skipped, and a
    # skipped job counts as passing on a required check: without it, a red
    # job would leave this one skipped and the pull request mergeable. Not
    # `!cancelled()`: `cancel-in-progress` cancels runs, and a cancelled run
    # must not read as a pass either. Every result other than `success` fails
    # it, `skipped` included, because none of these jobs has an `if:` of its
    # own and so none is ever skipped on purpose.
    if: always()
    needs: [green, red, refused, unpulled, fence]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: ${RESULTS}"
          for r in ${RESULTS}; do
            [ "${r}" = success ] || { echo "::error::a required job ended '${r}'"; exit 1; }
          done
